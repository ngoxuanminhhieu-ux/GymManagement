services:
  mysql_db:
    image: mysql:8.0
    container_name: gym_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gym_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql_db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql_db
    networks:
      - backend_net
      - frontend_net

  gym_app:
    build: ./app
    container_name: gym_app
    restart: unless-stopped
    environment:
      DB_HOST: mysql_db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      - mysql_db
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net
      - frontend_net

  nginx_proxy:
    image: nginx:alpine
    container_name: gym_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gym_app
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net

  prometheus:
    image: prom/prometheus:latest
    container_name: gym_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring_net
      - frontend_net
      - backend_net

  grafana:
    image: grafana/grafana:latest
    container_name: gym_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: gym_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: gym_nginx_exporter
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://nginx_proxy:80/nginx_status'
    depends_on:
      - nginx_proxy
    networks:
      - frontend_net
      - monitoring_net

  mysqld_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: gym_mysqld_exporter
    restart: unless-stopped
    volumes:
      - ./monitoring/.my.cnf:/cfg/.my.cnf:ro
    command:
      - '--config.my-cnf=/cfg/.my.cnf'
    depends_on:
      - mysql_db
    networks:
      - backend_net
      - monitoring_net

  loki:
    image: grafana/loki:3.0.0
    container_name: gym_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring_net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: gym_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
  monitoring_net:
    driver: bridge

volumes:
  mysql_data:
